<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="{{ url_for('static', filename='js/loading.js') }}"></script>
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="STMS" />
    <meta name="theme-color" content="#D7B35B" />
    <meta name="description" content="Student Tenant Management System - The Elis Center" />
    <title>{% block title %}Dashboard | STMS{% endblock %}</title>
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}" />
    <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='img/icons/icon-192.png') }}" />
    <link rel="icon" type="image/png" sizes="512x512" href="{{ url_for('static', filename='img/icons/icon-512.png') }}" />
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/icons/icon-192.png') }}" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}?v=7" />

    {# Design system: tokens, components, motion. Loaded after app.css and
       before the per-page head block, so a page can still own a rule it needs to. #}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}?v=2" />
    
    <!-- Socket.IO Client -->
    <script src="https://cdn.socket.io/4.6.0/socket.io.min.js" integrity="sha384-c79GN5VsunZvi+Q/WObgk2in0CbZsHnjEqvFxC5DxHn9lTfNce2WW6h2pH6u/kF+" crossorigin="anonymous"></script>
    
    <script defer src="{{ url_for('static', filename='js/app.js') }}?v=3"></script>
    <script defer src="{{ url_for('static', filename='js/submit_guard.js') }}?v=1"></script>
    <script defer src="{{ url_for('static', filename='js/number_input.js') }}?v=1"></script>
    <script defer src="{{ url_for('static', filename='js/env_widget.js') }}?v=3"></script>
    <script>
      if ('serviceWorker' in navigator) {
        let __swRefreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (__swRefreshing) return; __swRefreshing = true; window.location.reload();
        });
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/static/sw.js')
            .then(reg => { reg.update(); console.log('SW registered'); })
            .catch(err => console.log('SW registration failed'));
        });
      }
    </script>
    {% block head %}{% endblock %}
    {# Consistency layer: loaded after the page's own <style> so the few
       components that appear on many pages settle on one appearance. #}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme-final.css') }}?v=2" />
  </head>
  <body class="dash-body" {% block body_attrs %}{% endblock %}>
    <div class="sidebar-backdrop js-sidebar-backdrop"></div>
    <div class="dash">
      <aside class="dash__side">
        <div class="dash__brand">
          <img src="{{ url_for('static', filename='img/elis-mark.png') }}" alt="Elis mark" class="dash__logo" />
          <div>
            <div class="dash__brandTitle">THE ELIS CENTER</div>
            <div class="dash__brandSub">Commercial and Residences</div>
</div>
</div>
        {% block sidebar %}{% endblock %}
      </aside>

      <div class="dash__main">
        <header class="topbar">
          <div class="topbar__left">
            <button class="hamburger-menu js-toggle-sidebar" type="button" aria-label="Toggle sidebar">
              <span></span>
              <span></span>
              <span></span>
</button>
            {% block topbar_left %}{% endblock %}
            {% if current_user.is_authenticated and current_user.role.value == 'admin' and admin_search_scope %}
            <div class="topbar-search js-search" data-url="{{ url_for('admin.global_search') }}" data-scope="{{ admin_search_scope }}">
              <svg class="topbar-search__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
              <input type="text" class="topbar-search__input js-search-input" placeholder="{{ admin_search_placeholder }}" autocomplete="off" aria-label="Search this page" />
              <div class="topbar-search__results js-search-results" hidden></div>
            </div>
            {% endif %}
</div>
          <div class="topbar__right">
            <div class="nav__env nav__env--inline">{% include "components/_env_widget.html" %}</div>
            {% if current_user.is_authenticated and current_user.role.value in ('admin', 'tenant') %}
            <!-- Notification bell -->
            <div class="topbar-widget js-dropdown">
              <button type="button" class="topbar-iconbtn js-dropdown-toggle" aria-label="Notifications" id="notifBellBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
                {% if nav_notif_total %}<span class="topbar-dot">{{ nav_notif_total if nav_notif_total < 100 else '99+' }}</span>{% endif %}
              </button>
              <div class="topbar-menu topbar-menu--notif js-dropdown-menu" hidden>
                <div class="topbar-menu__head">
                  <span>Notifications</span>
                  {% if nav_notif_total %}<span class="topbar-menu__count">{{ nav_notif_total }} {{ 'pending' if current_user.role.value == 'admin' else 'unread' }}</span>{% endif %}
                </div>
                <div class="topbar-menu__body">
                  {% for n in nav_notifications %}
                    <a href="{{ n.url }}" class="notif-item">
                      <span class="notif-item__type notif-item__type--{{ n.type|lower }}">{{ n.type }}</span>
                      <span class="notif-item__title">{{ n.title }}</span>
                      <span class="notif-item__sub">{{ n.subtitle }}{% if n.time %} • {{ ph(n.time).strftime('%b %d, %I:%M %p') }}{% endif %}</span>
                    </a>
                  {% else %}
                    <div class="notif-empty">You're all caught up.</div>
                  {% endfor %}
                </div>
              </div>
            </div>
            {% endif %}

            <!-- Profile dropdown -->
            <div class="topbar-widget js-dropdown">
              <button type="button" class="topbar__user js-dropdown-toggle">
                {% if current_user.is_authenticated and current_user.profile_picture %}
                  <div class="topbar__avatar" style="overflow:hidden; padding:0;"><img src="{{ media_url(current_user.profile_picture) }}" alt="{{ current_user.full_name }}" style="width:100%; height:100%; object-fit:cover;" /></div>
                {% else %}
                  <div class="topbar__avatar">{{ (current_user.full_name[:1] if current_user.is_authenticated else "U") }}</div>
                {% endif %}
                <div class="topbar__meta">
                  <div class="topbar__name">{{ current_user.full_name if current_user.is_authenticated else "Guest" }}</div>
                  <div class="topbar__role muted">{{ current_user.role.value if current_user.is_authenticated else "" }}</div>
                </div>
              </button>
              <div class="topbar-menu topbar-menu--profile js-dropdown-menu" hidden>
                <div class="topbar-menu__head topbar-menu__head--profile">
                  <div class="topbar__name">{{ current_user.full_name if current_user.is_authenticated else "Guest" }}</div>
                  {% if current_user.is_authenticated %}<div class="muted" style="font-size:12px">{{ current_user.email }}</div>{% endif %}
                </div>
                <div class="topbar-menu__body">
                  {% if current_user.is_authenticated %}
                    {% set _r = current_user.role.value %}
                    {% if _r == 'admin' %}
                      <a href="{{ url_for('admin.dashboard') }}" class="menu-link">Dashboard</a>
                    {% elif _r == 'tenant' %}
                      <a href="{{ url_for('tenant.dashboard') }}" class="menu-link">Dashboard</a>
                    {% else %}
                      <a href="{{ url_for('user.dashboard') }}" class="menu-link">Dashboard</a>
                    {% endif %}
                  {% endif %}
                  <form method="post" action="{{ url_for('auth.logout') }}" style="margin:0">
                    <button type="submit" class="menu-link menu-link--danger">Logout</button>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </header>
        <div class="nav__env nav__env--row">{% include "components/_env_widget.html" %}</div>

        <main class="dash__content">
          {% include "components/_flash.html" %}
          {% block content %}{% endblock %}
        </main>
</div>
</div>
    
    <!-- Initialize SocketIO Connection -->
    <script>
      // Global SocketIO instance - WebSocket + Polling
      window.socket = io({
        transports: ['websocket', 'polling'],
        reconnection: true,
        reconnectionDelay: 1000,
        reconnectionAttempts: 5
      });
      
      // Connection status handlers
      window.socket.on('connect', function() {
        console.log(' SocketIO Connected');
      });
      
      window.socket.on('disconnect', function() {
        console.log(' SocketIO Disconnected');
      });
      
      window.socket.on('connection_status', function(data) {
        console.log('Connection Status:', data);
      });
      
      window.socket.on('error', function(data) {
        console.error('SocketIO Error:', data);
      });
    </script>

    <!-- Topbar dropdowns (notifications + profile) and real-time bell -->
    <script>
      (function(){
        // --- Dropdown open/close ---
        document.querySelectorAll('.js-dropdown-toggle').forEach(function(btn){
          btn.addEventListener('click', function(e){
            e.stopPropagation();
            var menu = btn.parentElement.querySelector('.js-dropdown-menu');
            var isOpen = !menu.hasAttribute('hidden');
            document.querySelectorAll('.js-dropdown-menu').forEach(function(m){ m.setAttribute('hidden',''); });
            if (!isOpen) menu.removeAttribute('hidden');
          });
        });
        document.querySelectorAll('.js-dropdown-menu').forEach(function(m){
          m.addEventListener('click', function(e){ e.stopPropagation(); });
        });
        document.addEventListener('click', function(){
          document.querySelectorAll('.js-dropdown-menu').forEach(function(m){ m.setAttribute('hidden',''); });
        });
        document.addEventListener('keydown', function(e){
          if (e.key === 'Escape') document.querySelectorAll('.js-dropdown-menu').forEach(function(m){ m.setAttribute('hidden',''); });
        });

        // --- Real-time bell via SocketIO ---
        function bump(type, title, subtitle, url){
          var bell = document.querySelector('.topbar-iconbtn');
          if (!bell) return;
          var dot = bell.querySelector('.topbar-dot');
          if (!dot){ dot = document.createElement('span'); dot.className = 'topbar-dot'; dot.textContent = '0'; bell.appendChild(dot); }
          var n = (parseInt((dot.textContent || '0').replace('+',''), 10) || 0) + 1;
          dot.textContent = n < 100 ? n : '99+';
          dot.style.animation = 'none'; void dot.offsetWidth; dot.style.animation = 'bellPulse .5s ease';
          var body = document.querySelector('.topbar-menu--notif .topbar-menu__body');
          if (body){
            var empty = body.querySelector('.notif-empty'); if (empty) empty.remove();
            var a = document.createElement('a'); a.href = url || '#'; a.className = 'notif-item';
            a.innerHTML = '<span class="notif-item__type notif-item__type--' + type.toLowerCase() + '">' + type + '</span>' +
              '<span class="notif-item__title">' + (title || ('New ' + type)) + '</span>' +
              '<span class="notif-item__sub">' + (subtitle || 'Just now') + '</span>';
            body.insertBefore(a, body.firstChild);
          }
        }
        if (window.socket){
          window.socket.on('new_concern', function(d){ bump('Concern', (d && d.subject) || 'New concern', 'Just now', '/admin/concerns'); });
          window.socket.on('new_renewal', function(d){ bump('Renewal', 'New renewal request', 'Just now', '/admin/renewals'); });
          window.socket.on('new_feedback', function(d){ bump('Feedback', 'New feedback received', 'Just now', '/admin/feedbacks'); });
          window.socket.on('new_announcement', function(d){ bump('Announcement', (d && d.title) || 'New announcement', 'Just now', '/tenant/announcements'); });
          window.socket.on('new_document', function(d){ bump('Document', (d && d.title) || 'New document', 'Just now', '/tenant/documents'); });
          window.socket.on('new_payment_proof', function(d){ bump('Payment', (d && d.tenant_name ? d.tenant_name + ' submitted a payment' : 'New payment proof submitted'), 'Awaiting verification', '/admin/payments'); });
          window.socket.on('payment_received', function(d){ bump('Payment', 'Payment verified', (d && d.amount ? '₱' + Number(d.amount).toLocaleString() + ' confirmed' : 'Just now'), '/tenant/payments'); });
          window.socket.on('utility_bill_reminder', function(d){ bump('Bill', (d && d.title) || 'Utility bill reminder', (d && d.subtitle) || 'Due soon', '/tenant/payments'); });
        }

        // --- Global search ---
        var wrap = document.querySelector('.js-search');
        if (wrap){
          var input = wrap.querySelector('.js-search-input');
          var box = wrap.querySelector('.js-search-results');
          var endpoint = wrap.getAttribute('data-url');
          var scope = wrap.getAttribute('data-scope');
          var timer;
          var GROUPS = [['customers','Customers'],['units','Units'],['reservations','Reservations'],['payments','Payments'],['documents','Documents']];
          function esc(s){ var d = document.createElement('div'); d.textContent = (s == null ? '' : String(s)); return d.innerHTML; }
          function render(data){
            var html = '', total = 0;
            GROUPS.forEach(function(g){
              var items = data[g[0]] || [];
              if (!items.length) return;
              total += items.length;
              html += '<div class="search-group__label">' + g[1] + '</div>';
              items.forEach(function(it){
                html += '<a class="search-item" href="' + esc(it.url) + '">' +
                  '<span class="search-item__label">' + esc(it.label) + '</span>' +
                  '<span class="search-item__sub">' + esc(it.sub) + '</span></a>';
              });
            });
            box.innerHTML = total ? html : '<div class="search-empty">No matches found.</div>';
            box.removeAttribute('hidden');
          }
          function run(q){
            fetch(endpoint + '?q=' + encodeURIComponent(q) + '&scope=' + encodeURIComponent(scope))
              .then(function(r){ return r.ok ? r.json() : null; })
              .then(function(d){ if (d) render(d); })
              .catch(function(){});
          }
          input.addEventListener('input', function(){
            var q = input.value.trim();
            clearTimeout(timer);
            if (q.length < 2){ box.setAttribute('hidden',''); box.innerHTML = ''; return; }
            timer = setTimeout(function(){ run(q); }, 220);
          });
          input.addEventListener('focus', function(){ if (box.innerHTML) box.removeAttribute('hidden'); });
          document.addEventListener('click', function(e){ if (!wrap.contains(e.target)) box.setAttribute('hidden',''); });
          input.addEventListener('keydown', function(e){ if (e.key === 'Escape'){ box.setAttribute('hidden',''); input.blur(); } });
        }
      })();
    </script>
    
    <script>
    // Auto-dismiss flash messages after 5 seconds — long enough to read,
    // short enough that users don't have to dismiss them manually.
    (function() {
      function autoDismissFlashMessages() {
        const flashMessages = document.querySelectorAll('.flash, .alert');
        flashMessages.forEach(function(message) {
          setTimeout(function() {
            message.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
            message.style.opacity = '0';
            message.style.transform = 'translateY(-10px)';
            setTimeout(function() {
              message.remove();
            }, 300);
          }, 5000);
        });
      }
      
      // Run on page load
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', autoDismissFlashMessages);
      } else {
        autoDismissFlashMessages();
      }
    })();
    </script>
  </body>
</html>
